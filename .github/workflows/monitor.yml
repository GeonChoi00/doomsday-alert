name: 둠스데이 특별관 예매 감시

on:
  schedule:
    - cron: "3-59/5 * * * *"     # 5분마다 (매시 2,7,12…분 ― 붐비는 정각을 피해서 지연·누락 줄이기)
  workflow_dispatch:              # Actions 탭에서 수동 실행 (테스트용)
    inputs:
      ping:
        description: "텔레그램 연결 테스트 메시지만 보내기"
        type: boolean
        default: false
      test_keyword:
        description: "테스트용 영화 키워드 (비우면 실제 감시: 둠스데이)"
        type: string
        default: ""
      test_date_start:
        description: "테스트 시작 날짜 YYYY-MM-DD (비우면 코드 설정값)"
        type: string
        default: ""
      test_date_end:
        description: "테스트 끝 날짜 YYYY-MM-DD (비우면 코드 설정값)"
        type: string
        default: ""

# 감시 작업이 겹쳐 돌지 않게 하나씩만 실행 (기록 파일 충돌 방지)
concurrency:
  group: ticket-monitor
  cancel-in-progress: false

permissions:
  contents: write                 # sent_state.json(알림 기록)을 저장소에 커밋하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 예매 오픈 체크
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PING: ${{ inputs.ping && '1' || '0' }}
          MOVIE_KEYWORD: ${{ inputs.test_keyword }}
          DATE_START: ${{ inputs.test_date_start }}
          DATE_END: ${{ inputs.test_date_end }}
          # 테스트 키워드로 돌릴 때는 기록 파일을 건드리지 않고(NO_STATE), 한 번만 체크
          NO_STATE: ${{ inputs.test_keyword != '' && '1' || '0' }}
          LOOP_SECONDS: ${{ inputs.test_keyword != '' && '0' || '200' }}
        run: python check_tickets.py

      - name: 알림 기록 저장 (변경 있을 때만 커밋)
        if: always()
        run: |
          if [ -f sent_state.json ] && [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "알림 기록 업데이트 [skip ci]"
            git pull --rebase --autostash || true
            git push
          else
            echo "변경 없음"
          fi
